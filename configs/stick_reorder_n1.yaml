env:
  robot: Panda
  num_sticks: 1
  stick_length: 0.20
  stick_radius: 0.0075
  goal_spacing: 0.06
  success_threshold: 0.03
  orientation_threshold: 0.1745
  lambda_rot: 0.1
  goal_yaw: 0.0
  init_x_range: [-0.12, -0.06]
  init_y_range: [-0.15, 0.15]
  reward_shaping: true

training:
  algorithm: SAC
  total_timesteps: 1_000_000
  learning_rate: 3.0e-4
  batch_size: 256
  buffer_size: 1_000_000
  seed: 42
  eval_freq: 10000
  n_eval_episodes: 10
  checkpoint_freq: 50000

modal:
  gpu: "A10G"
  timeout: 10800
